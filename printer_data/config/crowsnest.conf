#### crowsnest.conf
#### This is the default config after installation.
#### It is also used as the default config in MainsailOS.
#### For details on how to configure this to your needs, see:
#### https://github.com/mainsail-crew/crowsnest/blob/master/README.md


#####################################################################
####                                                            #####
####      Information about ports and according URL's           #####
####                                                            #####
#####################################################################
####                                                            #####
####    Port 8080 equals /webcam/?action=[stream/snapshot]      #####
####    Port 8081 equals /webcam2/?action=[stream/snapshot]     #####
####    Port 8082 equals /webcam3/?action=[stream/snapshot]     #####
####    Port 8083 equals /webcam4/?action=[stream/snapshot]     #####
####                                                            #####
####    Note: These ports are default for most Mainsail         #####
####    installations. Using any other port would involve       #####
####    changing the proxy configuration or using URLs          #####
####    with the specific port like                             #####
####    http://<ip>:<port>/?action=[stream/snapshot]            #####
####                                                            #####
#####################################################################
####    RTSP Stream URL: ( if enabled and supported )           #####
####    rtsp://<ip>:<rtsp_port>/stream.h264                     #####
#####################################################################


[crowsnest]
log_path: /home/brownem/printer_data/logs/crowsnest.log
log_level: verbose                      # Valid Options are quiet/verbose/debug
delete_log: false                       # Deletes log on every restart, if set to true
no_proxy: false                         # If set to true, no reverse proxy is required. Only change this, if you know what you are doing.

[cam 1]
mode: camera-streamer                   # ustreamer - Provides MJPG and snapshots. (All devices)
                                        # camera-streamer - Provides WebRTC, MJPG and snapshots. (only RPiOS + RPi 0/1/2/3/4)
enable_rtsp: false                      # If camera-streamer is used, this also enables usage of an RTSP server
rtsp_port: 8554                         # Set different ports for each device!
port: 8080                              # HTTP/MJPG stream/snapshot port
device: /dev/v4l/by-id/usb-3DO_3DO_4K_USB_CAMERA_US_3DO-video-index0                     # See log for available devices
resolution: 1920x1080                   # <width>x<height> format
max_fps: 60                             # If hardware supports it, it will be forced, otherwise ignored/coerced.
#custom_flags:                          # You can run the stream services with custom flags.
v4l2ctl:power_line_frequency=2                            # Add v4l2-ctl parameters to setup your camera, see log for your camera capabilities.
# brightness=15                           # min=0, max=64, step=1, default=15
# contrast=4                              # min=0, max=95, step=1, default=4
# saturation=70                           # min=0, max=100, step=1, default=70
# hue=0                                   # min=-2000, max=2000, step=1, default=0
# white_balance_automatic=1               # default=1
# gamma=115                               # min=1, max=300, step=1, default=115
# gain=0                                  # (ISO control) min=0, max=480, step=1, default=0
# power_line_frequency=2                  # min=0, max=2, default=1;  0: Disabled, 1: 50 Hz, 2: 60 Hz
# white_balance_temperature=4600          # min=2800, max=6500, step=1, default=4600, flags=inactive
# sharpness=1                             # min=1, max=7, step=1, default=1
# backlight_compensation=1                # min=0, max=2, step=1, default=1; 0: LED off, 1: LED on when stream is open, 2: LED always on
# auto_exposure=3                         # min=0, max=3, default=3; 1: Manual Mode, 3: Aperture Priority Mode
# exposure_time_absolute=166              # min=3, max=2047, step=1, default=166, flags=inactive
# pan_absolute=0                          # min=-648000, max=648000, step=3600, default=0
# tilt_absolute=0                         # min=-648000, max=648000, step=3600, default=0
# focus_absolute=0                        # min=0, max=1023, step=1, default=0, flags=inactive
# focus_automatic_continuous=0            # default=0
# zoom_absolute=0                         # min=0, max=60, step=1, default=0

