# This file contains common pin mappings for the LDO Voron 2.4 Rev. D kit
# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON 2.4 350mm Leviathan v1.1 + Nitehawk-SB v2 config

## Include MainsailOS
##--------------------------------------------------------------------
[include mainsail.cfg]
##--------------------------------------------------------------------

## Include all MCUs; Leviathan v1.1, Nitehawk-SB v2, and Beacon Probe - in that order
##--------------------------------------------------------------------
[include mcus.cfg]
##--------------------------------------------------------------------

## Include main control board (leviathan MCU, case lights, printer kinematics, steppers, bed heater, fans, filters, etc)
##--------------------------------------------------------------------
[include main_control.cfg]
##--------------------------------------------------------------------

## Include the toolhead; Nitehawk-sb v2
##--------------------------------------------------------------------
[include toolhead.cfg]
##--------------------------------------------------------------------

## Include the Nevermore filtration macros
##--------------------------------------------------------------------
[include nevermore.cfg]
##--------------------------------------------------------------------

## Enabled 'bonus' features of Klipper
##--------------------------------------------------------------------
[exclude_object] #Enables the user to cancel the continued print of a single object on a tray (in case of failure) by utilizing the "label objects" function of a slicer output (when available)
##--------------------------------------------------------------------

## Include the display configuration
##--------------------------------------------------------------------
[include display.cfg]
##--------------------------------------------------------------------

## Include all macros in root folder
##--------------------------------------------------------------------
[include macros/*.cfg]
##--------------------------------------------------------------------

## Include all macros in macros/controls folder
##--------------------------------------------------------------------
[include macros/controls/*.cfg]
##--------------------------------------------------------------------

## Include all macros in macros/gcodes folder
##--------------------------------------------------------------------
[include macros/gcodes/*.cfg]
##--------------------------------------------------------------------



