# This file contains the pin mappings for the LDO Voron 2.4 Rev. D kit
# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON 2.4 350mm Leviathan v1.1 config

## *** Included in this file: ***
## Neopixel lights for chamber lighting     [include case_lights.cfg]
## MCU path for Leviathan                   [mcu] section
## Printer kinematics info                  [printer] section; CoreXY
## Bed mesh parameters                      [bed_mesh] section 
## X/Y Steppers                             [stepper_x] and [stepper_y] sections
## Z Steppers                               [stepper_z] sections (z, z1, z2, z3), including virtual z endstop
## Bed Heater                               [heater_bed] section, including bed PID and thermistor
## Controller fans                          [controller_fan] section
## Under-Bed fans                           [fan_generic] section
## Gantry Homing & Adjustment               [idle_timeout] and [quad_gantry_level] sections, including probe points and min/max corner positions


## Include the Chamber Neopixel Pinout
##--------------------------------------------------------------------
[include case_lights.cfg]
##--------------------------------------------------------------------



#####################################################################
#   Printer kinematics definitions
#####################################################################

[printer]
# max_accel found in [input_shaper], inside of toolhead.cfg
kinematics: corexy
max_velocity: 300  
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0



#####################################################################
#   Bed Mesh Parameters
#####################################################################
[bed_mesh]
speed: 300
#horizontal_move_z: 10
##--------------------------------------------------------------------

mesh_min: 25, 25
mesh_max: 325, 325
zero_reference_position: 175,175 #for use with stock z endstop

##--------------------------------------------------------------------
#fade_start: 0.6
#fade_end: 10.0
probe_count: 15,15 # Values should be odd, so one point is directly at bed center
algorithm: bicubic



#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to HV STEPPER 0
##  Endstop connected to Toolhead PCB
[stepper_x]
step_pin: PB10
dir_pin: PB11
enable_pin: !PG0
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  #set to 200 for 1.8 degree stepper
endstop_pin: nhk:PB0
position_min: 0
##--------------------------------------------------------------------

position_endstop: 353
position_max: 353

##--------------------------------------------------------------------
homing_speed: 25   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_x]
cs_pin: PE15
spi_bus: spi4
#diag0_pin: ^!PG1
interpolate: false
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to HV STEPPER 1
##  Endstop connected to Toolhead PCB
[stepper_y]
step_pin: PF15
dir_pin: !PF14
enable_pin: !PE9
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  #set to 200 for 1.8 degree stepper
endstop_pin: nhk:PB1
position_min: 0
##--------------------------------------------------------------------

position_endstop: 353
position_max: 353

##--------------------------------------------------------------------
homing_speed: 25  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc5160 stepper_y]
cs_pin: PE11
spi_bus: spi4
#diag0_pin: ^!PE10
interpolate: false
run_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0



#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to STEPPER 0
##  Endstop connected to Z-ENDSTOP
[stepper_z]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD7
rotation_distance: 40
gear_ratio: 80:16  
microsteps: 32
endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop
homing_retract_dist: 0 # beacon needs this to be set to 0

##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
##  position_endstop: -0.5
##--------------------------------------------------------------------

#  Uncomment below for 350mm build
position_max: 322

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z]
uart_pin: PD5
#diag_pin: ^!PD6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
##  Connected to STEPPER 1
[stepper_z1]
step_pin: PC12
dir_pin: PC11
enable_pin: !PD2
rotation_distance: 40
gear_ratio: 80:16 
microsteps: 32

##--------------------------------------------------------------------

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z1]
uart_pin: PD0
#diag_pin: ^!PD1
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##--------------------------------------------------------------------

##  Z2 Stepper - Rear Right
##  Connected to STEPPER 2
[stepper_z2]
step_pin: PC9
dir_pin: !PC8
enable_pin: !PC10
rotation_distance: 40
gear_ratio: 80:16 
microsteps: 32

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z2]
uart_pin: PA8
#diag_pin: ^!PA15
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##--------------------------------------------------------------------

##  Z3 Stepper - Front Right
##  Connected to STEPPER 3
[stepper_z3]
step_pin: PG7
dir_pin: PG6
enable_pin: !PC7
rotation_distance: 40
gear_ratio: 80:16 
microsteps: 32

##  Make sure to update below for your relevant driver (2209 or 5160)
[tmc2209 stepper_z3]
uart_pin: PG8
#diag_pin: ^!PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0



#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
##  SSR Pin - HEATBED
##  Thermistor - TH1
heater_pin: PG11
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA2
pullup_resistor: 2200

##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 1.0
min_temp: 0
max_temp: 120



#####################################################################
#   Fan Control
#####################################################################

# --- Controller fan - FAN2 ----
[controller_fan controller_fan]
pin: PF7
##tachometer_pin: PF6
kick_start_time: 0.5
heater: heater_bed

# ---------- Bed fans ----------
[fan_generic bed_fans]
pin: PB3
max_power: 1.0
cycle_time: 0.010
shutdown_speed: 1
kick_start_time: 0.5
off_below: 0.10



#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 3600

[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
##  Depreciated with Beacon installed. Re-enable this section if going back to a physical or optical switch
home_xy_position:175,175
#speed:100
z_hop: 10
z_hop_speed: 30.0

##  Use QUAD_GANTRY_LEVEL macro to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]
gantry_corners:
    -60,-10
    410,420

##  Probe points
points:       ; regular points
    25,35
    25,315
    325,315
    325,35

speed: 200
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#####################################################################
#   I2C port
#####################################################################
#i2c_software_scl_pin: nhk:PB3
#i2c_software_sda_pin: nhk:PB4